name: Build and test D.A Plugins
on: [push, pull_request, workflow_dispatch]
# Share the branch group across push/PR events to avoid duplicate ten-plugin builds.
concurrency:
  group: da-plugins-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable core with sanitizers
        run: cmake -S . -B build-core -DDA_BUILD_PLUGINS=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: cmake --build build-core --parallel 2
      - run: ctest --test-dir build-core --output-on-failure
  plugins:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev pkg-config
      - name: Configure all ten targets
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build all formats
        run: cmake --build build --config Release --parallel 2
      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: da-plugins-development-${{ runner.os }}
          path: |
            build/*_artefacts/Release/**
          if-no-files-found: error
